<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sajib Sutradhar</title>
<meta name="description" content="Sajib Sutradhar, Executive in the billing department at DocPro Health Inc. Medical coding with CPT and ICD-10-CM, U.S. healthcare RCM operations in eClinicalWorks and MDLand, and self-built billing workflow automation. B.Sc. in Electrical and Electronic Engineering.">
<meta name="author" content="Sajib Sutradhar">
<meta property="og:type" content="profile">
<meta property="og:title" content="Sajib Sutradhar">
<meta property="og:description" content="Medical coding with CPT and ICD-10-CM, RCM operations in eClinicalWorks and MDLand, and automation built for billing workflows.">
<meta name="theme-color" content="#07111F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07111F; --bg2:#0B1728; --card:#101F33; --card2:#14243A;
  --cyan:#35D5F2; --blue:#3898FF;
  --t1:#F4F7FB; --t2:#B0BDCC; --t3:#8293A8;
  --line:rgba(141,172,204,.16);
  --line2:rgba(141,172,204,.28);
  --sans:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --nav:68px;
  --r:12px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
  scroll-padding-top:calc(var(--nav) + 18px + env(safe-area-inset-top,0px));
}
body{
  margin:0;background:var(--bg);color:var(--t1);
  font-family:var(--sans);font-size:16.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
/* ambient light behind the top of the page */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(760px 420px at 18% -8%, rgba(53,213,242,.13), transparent 62%),
    radial-gradient(620px 380px at 88% 2%, rgba(56,152,255,.11), transparent 60%);
}
body::before{
  content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  background:var(--bg);z-index:60;
}
main,.nav,footer{position:relative;z-index:1}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------------- scroll progress ---------------- */
#prog{
  position:fixed;top:env(safe-area-inset-top,0px);left:0;height:2px;width:0;z-index:61;
  background:linear-gradient(90deg,var(--cyan),var(--blue));
}

/* ---------------- navigation ---------------- */
.nav{
  position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;
  height:var(--nav);
  background:rgba(7,17,31,.82);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;transition:border-color .25s ease,background .25s ease;
}
.nav.stuck{border-bottom-color:var(--line);background:rgba(7,17,31,.93)}
.nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:-.01em}
.mono-badge{
  width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;
  overflow:hidden;
  font-family:var(--mono);font-size:13px;color:#06121D;font-weight:500;
  background:linear-gradient(140deg,var(--cyan),var(--blue));
  box-shadow:0 0 0 1px rgba(53,213,242,.45);
}
.mono-badge img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{font-size:15.5px;font-weight:700}
.brand span{display:block;font-size:11.5px;font-weight:500;color:var(--t3);letter-spacing:.02em}
.navend{display:flex;align-items:center;gap:12px}
.views{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  font-family:var(--mono);font-size:11.5px;color:var(--t3);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  background:rgba(141,172,204,.05);
}
.views[hidden]{display:none}
.views svg{width:13px;height:13px;color:var(--cyan);flex:none}
.views b{font-weight:500;color:var(--t1)}
.navlinks{display:flex;align-items:center;gap:4px}
.navlinks a{
  font-size:14px;font-weight:500;color:var(--t2);padding:8px 13px;border-radius:8px;
  transition:color .2s ease,background .2s ease;
}
.navlinks a:hover{color:var(--t1);background:rgba(141,172,204,.08)}
.navlinks a.active{color:var(--cyan)}
.burger{
  display:none;background:none;border:1px solid var(--line2);border-radius:9px;
  width:40px;height:40px;color:var(--t1);cursor:pointer;place-items:center;
}

/* ---------------- hero ---------------- */
.hero{padding:calc(var(--nav) + 76px) 0 84px;position:relative;overflow:hidden}
.hero .grid-lines{
  position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:68px 68px;
  -webkit-mask-image:radial-gradient(760px 420px at 30% 18%,#000,transparent 72%);
  mask-image:radial-gradient(760px 420px at 30% 18%,#000,transparent 72%);
}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.34fr .66fr;gap:56px;align-items:center}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);
  border:1px solid rgba(53,213,242,.3);background:rgba(53,213,242,.07);
  padding:6px 13px;border-radius:999px;margin-bottom:26px;
}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--cyan);flex:none}
h1{
  font-size:clamp(36px,5.6vw,60px);line-height:1.04;letter-spacing:-.032em;
  font-weight:800;margin:0 0 14px;
}
.role{
  font-size:clamp(17px,2.1vw,21px);font-weight:600;margin:0 0 22px;color:var(--t1);
}
.role em{font-style:normal;color:var(--cyan)}
.lede{font-size:16.5px;color:var(--t2);max-width:60ch;margin:0 0 32px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:26px}
.btn{
  display:inline-flex;align-items:center;gap:9px;font:inherit;font-size:14.5px;font-weight:600;
  padding:12px 21px;border-radius:10px;cursor:pointer;border:1px solid transparent;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;
}
.btn svg{width:17px;height:17px}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#05101B}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(53,213,242,.26)}
.btn-ghost{background:rgba(141,172,204,.06);border-color:var(--line2);color:var(--t1)}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-2px)}
.socials{display:flex;gap:10px}
.socials a{
  width:40px;height:40px;border:1px solid var(--line2);border-radius:10px;
  display:grid;place-items:center;color:var(--t2);
  transition:color .2s ease,border-color .2s ease,transform .2s ease;
}
.socials a:hover{color:var(--cyan);border-color:var(--cyan);transform:translateY(-2px)}
.socials svg{width:18px;height:18px}

/* portrait */
.shot{position:relative;justify-self:center;text-align:center;margin:0}
.shot .frame{
  position:relative;width:236px;height:236px;margin:0 auto;
  border-radius:50%;overflow:hidden;background:var(--card);
  border:1px solid rgba(53,213,242,.4);
  box-shadow:0 0 0 9px rgba(53,213,242,.055),0 18px 44px rgba(3,10,20,.6);
}
.shot img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.shot .plate{display:block;margin-top:18px}
.shot .plate b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.shot .plate span{
  display:block;margin-top:3px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;color:var(--cyan);
}

/* hero highlights */
.highlights{
  margin:58px 0 0;display:grid;grid-template-columns:repeat(4,1fr);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(16,31,51,.5);
}
.highlights div{padding:18px 20px;border-right:1px solid var(--line)}
.highlights div:last-child{border-right:0}
.highlights dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.highlights dd{margin:0;font-size:14.5px;font-weight:600;color:var(--t1)}

/* ---------------- sections ---------------- */
section{padding:84px 0;scroll-margin-top:calc(var(--nav) + 18px)}
section + section{border-top:1px solid var(--line)}
#sections > section:first-child{border-top:1px solid var(--line)}
.shead{display:flex;align-items:baseline;gap:15px;margin-bottom:38px}
.shead .no{font-family:var(--mono);font-size:13px;color:var(--cyan);font-weight:500}
.shead h2{font-size:clamp(23px,3vw,31px);font-weight:700;letter-spacing:-.025em;margin:0}
.shead .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

.prose p{color:var(--t2);max-width:72ch;margin:0 0 17px;font-size:16.5px}
.prose p:last-child{margin-bottom:0}

/* cards shared */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  transition:border-color .22s ease,transform .22s ease,background .22s ease;
}
.card:hover{border-color:rgba(53,213,242,.38);transform:translateY(-3px);background:var(--card2)}

/* skills */
.skillgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.skill{padding:22px}
.skill .ico{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:15px;
  background:rgba(53,213,242,.1);border:1px solid rgba(53,213,242,.22);color:var(--cyan);
}
.skill .ico svg{width:19px;height:19px}
.skill h3{font-size:15.5px;font-weight:600;margin:0 0 13px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0;padding:0;list-style:none}
.chips li{
  font-family:var(--mono);font-size:11.5px;color:var(--t2);
  background:rgba(141,172,204,.07);border:1px solid var(--line);
  border-radius:6px;padding:4px 9px;
}

/* experience timeline */
.tl{position:relative;padding-left:34px}
.tl::before{
  content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;
  background:linear-gradient(to bottom,var(--cyan),rgba(56,152,255,.35),transparent);
}
.job{position:relative;margin-bottom:22px}
.job:last-child{margin-bottom:0}
.job::before{
  content:"";position:absolute;left:-31px;top:26px;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line2);
}
.job.now::before{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(53,213,242,.14)}
.jobcard{padding:24px 26px}
.jobtop{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px}
.jobtop h3{font-size:18px;font-weight:700;margin:0;letter-spacing:-.015em}
.when{font-family:var(--mono);font-size:11.5px;color:var(--t3);white-space:nowrap}
.job.now .when{color:var(--cyan)}
.jobmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 16px;font-size:14px;color:var(--t2)}
.jobmeta .org{color:var(--cyan);font-weight:600}
.jobmeta .dot{width:3px;height:3px;border-radius:50%;background:var(--t3)}
.pill{
  font-family:var(--mono);font-size:10.5px;color:var(--t3);
  border:1px solid var(--line);border-radius:5px;padding:2px 7px;
}
.job ul{margin:0;padding:0;list-style:none}
.job li{position:relative;padding-left:19px;margin-bottom:9px;font-size:15px;color:var(--t2);max-width:76ch}
.job li:last-child{margin-bottom:0}
.job li::before{
  content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:2px;
  background:rgba(53,213,242,.5);transform:rotate(45deg);
}

/* project groups */
.group + .group{margin-top:46px}
.grouphead{margin-bottom:20px}
.grouphead h3{font-size:18px;font-weight:700;margin:0 0 5px;letter-spacing:-.015em}
.grouphead p{margin:0;font-size:14.5px;color:var(--t3)}
.toolgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tool{padding:19px 21px;border-left:2px solid var(--cyan)}
.tool.todo{border-left-color:rgba(141,172,204,.4)}
.tooltop{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:7px}
.tool h4{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.tool p{margin:0;font-size:14px;color:var(--t2)}
.tag{
  font-family:var(--mono);font-size:10.5px;color:var(--cyan);
  background:rgba(53,213,242,.09);border:1px solid rgba(53,213,242,.22);
  border-radius:5px;padding:2px 7px;white-space:nowrap;
}
.projgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.proj{padding:16px 19px;display:flex;align-items:flex-start;gap:13px}
.proj .tag{flex:none;margin-top:2px}
.proj span.n{font-size:14.5px;color:var(--t1);font-weight:500}
.proj.star{border-color:rgba(53,213,242,.34);background:var(--card2)}

/* education */
.edugrid{display:grid;gap:14px}
.edu{padding:22px 24px;display:flex;align-items:flex-start;gap:18px}
.edu .ico{
  width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:rgba(56,152,255,.1);border:1px solid rgba(56,152,255,.22);color:var(--blue);
}
.edu .ico svg{width:19px;height:19px}
.edu h3{font-size:16.5px;font-weight:600;margin:0 0 5px;letter-spacing:-.015em}
.edu .meta{font-size:14px;color:var(--t2);margin:0}
.edu .meta b{color:var(--t1);font-weight:600}
.edu .right{margin-left:auto;text-align:right;flex:none}
.edu .yr{font-family:var(--mono);font-size:11.5px;color:var(--cyan);display:block}
.edu .res{font-family:var(--mono);font-size:12px;color:var(--t2);display:block;margin-top:5px}

/* training + additional */
.cardgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.item{padding:20px 22px}
.item h3,.item h4{font-size:15.5px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
.item p{margin:0;font-size:14px;color:var(--t2)}
.item .sub{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-bottom:7px}
.sub-h{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--t3);margin:0 0 15px;
}
.block + .block{margin-top:34px}

/* contact */
.contactbox{
  border:1px solid var(--line);border-radius:18px;padding:46px;
  background:
    radial-gradient(620px 300px at 15% 0%,rgba(53,213,242,.09),transparent 65%),
    var(--card);
}
.contactbox h2{font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.03em;margin:0 0 14px}
.contactbox > p{color:var(--t2);max-width:62ch;margin:0 0 30px;font-size:16px}
.details{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:30px}
.detail{
  display:flex;align-items:center;gap:13px;padding:15px 17px;
  border:1px solid var(--line);border-radius:11px;background:rgba(7,17,31,.42);
  transition:border-color .2s ease,transform .2s ease;
}
a.detail:hover{border-color:var(--cyan);transform:translateY(-2px)}
.detail .ico{
  width:36px;height:36px;flex:none;border-radius:9px;display:grid;place-items:center;
  background:rgba(53,213,242,.1);color:var(--cyan);border:1px solid rgba(53,213,242,.2);
}
.detail .ico svg{width:17px;height:17px}
.detail dl{margin:0}
.detail dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.detail dd{margin:2px 0 0;font-size:14.5px;font-weight:500;word-break:break-word}

/* footer */
footer{border-top:1px solid var(--line);padding:30px 0 44px}
footer .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
footer .who b{display:block;font-size:14.5px;font-weight:700}
footer .who span{font-size:13px;color:var(--t3)}
footer .cp{font-size:12.5px;color:var(--t3)}

/* reveal */
[data-reveal]{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}
[data-reveal].in{opacity:1;transform:none}

/* ---------------- responsive ---------------- */
@media (max-width:980px){
  .hero .wrap{grid-template-columns:1fr;gap:44px}
  .shot{order:-1;justify-self:start;text-align:left}
  .shot .frame{width:172px;height:172px;margin:0}
  .highlights{grid-template-columns:repeat(2,1fr)}
  .highlights div:nth-child(2){border-right:0}
  .highlights div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .skillgrid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .navlinks{
    position:fixed;top:calc(var(--nav) + env(safe-area-inset-top,0px));left:0;right:0;
    flex-direction:column;align-items:stretch;gap:2px;padding:14px 20px 20px;
    background:rgba(7,17,31,.98);border-bottom:1px solid var(--line);
    transform:translateY(-130%);transition:transform .28s ease;
  }
  .navlinks.open{transform:translateY(0)}
  .navlinks a{padding:12px 14px;font-size:15px}
  .burger{display:grid}
  .hero{padding:calc(var(--nav) + 48px) 0 60px}
  section{padding:60px 0}
  .wrap{padding:0 20px}
  .skillgrid,.toolgrid,.projgrid,.cardgrid,.details{grid-template-columns:1fr}
  .highlights{grid-template-columns:1fr}
  .highlights div{border-right:0;border-bottom:1px solid var(--line)}
  .highlights div:last-child{border-bottom:0}
  .contactbox{padding:30px 22px;border-radius:14px}
  .btn{flex:1 1 auto;justify-content:center}
  .edu{flex-wrap:wrap}
  .edu .right{margin-left:0;text-align:left;width:100%}
  .edu .res{display:inline-block;margin-left:12px}
  .tl{padding-left:26px}
  .job::before{left:-24px}
  .jobcard{padding:20px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
  [data-reveal]{opacity:1;transform:none}
}
@media print{
  .nav,#prog,.socials,.cta,footer,.shot .plate{display:none}
  body::after{display:none}
  body{background:#fff;color:#000}
  .card,.contactbox{border-color:#ccc;background:#fff}
  section{padding:16pt 0;border-top:0}
  h1,.shead h2,.jobtop h3{color:#000}
  .lede,.prose p,.job li,.item p,.edu .meta{color:#222}
}
</style>
</head>
<body>

<div id="prog"></div>

<header class="nav" id="nav">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Back to top">
      <span class="mono-badge" id="mono"></span>
      <span><b id="brandName"></b><span id="brandRole"></span></span>
    </a>
    <div class="navend">
      <span class="views" id="views" hidden></span>
      <nav class="navlinks" id="navlinks" aria-label="Sections"></nav>
      <button class="burger" id="burger" aria-expanded="false" aria-controls="navlinks" aria-label="Open the menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="19" height="19"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero" id="hero" aria-labelledby="name">
    <div class="grid-lines" aria-hidden="true"></div>
    <div class="wrap">
      <div>
        <span class="eyebrow"><i aria-hidden="true"></i><span id="eyebrow"></span></span>
        <h1 id="name"></h1>
        <p class="role" id="role"></p>
        <p class="lede" id="lede"></p>
        <div class="cta" id="cta"></div>
        <div class="socials" id="socials"></div>
      </div>
      <figure class="shot">
        <div class="frame"><img id="photo" alt="" width="560" height="560"></div>
        <figcaption class="plate"><b id="plateName"></b><span id="plateLoc"></span></figcaption>
      </figure>
    </div>
    <div class="wrap"><dl class="highlights" id="highlights"></dl></div>
  </section>

  <div id="sections"></div>
</main>

<footer>
  <div class="wrap">
    <div class="who"><b id="fName"></b><span id="fRole"></span></div>
    <div class="socials" id="fSocials"></div>
    <div class="cp" id="fCp"></div>
  </div>
</footer>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var P = CV.person;

  /* ---------- icons (inline, no external library) ---------- */
  var ICON = {
    clipboard:'<path d="M9 3h6a1 1 0 0 1 1 1v1H8V4a1 1 0 0 1 1-1z"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="m9 13 2 2 4-4"/>',
    refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>',
    layers:'<path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 14 9 5 9-5"/>',
    code:'<path d="m9 18-6-6 6-6"/><path d="m15 6 6 6-6 6"/>',
    cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M10 10h4v4h-4z"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
    grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    cap:'<path d="m22 9-10-5L2 9l10 5 10-5z"/><path d="M6 11v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/>',
    award:'<circle cx="12" cy="9" r="5.5"/><path d="m8.5 13.5-1.5 8 5-2.6 5 2.6-1.5-8"/>',
    globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/>',
    zap:'<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>',
    mail:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3 7 9 6 9-6"/>',
    phone:'<path d="M5 3h4l2 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
    linkedin:'<path d="M4.5 9.5v10M4.5 5.2v.1"/><path d="M10 19.5v-10"/><path d="M10 13.5c0-2.2 1.6-3.6 3.6-3.6S17 11.3 17 13.5v6"/>',
    pin:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>',
    download:'<path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/>',
    arrow:'<path d="M12 4v15"/><path d="m5.5 13 6.5 6.5L18.5 13"/>',
    eye:'<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.7"/>',
    close:'<path d="M6 6l12 12M18 6 6 18"/>'
  };
  function svg(key) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON[key] || '') + '</svg>';
  }
  function has(v) { return typeof v === "string" && v.trim() !== ""; }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function initials(n) {
    return n.split(/\s+/).map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase();
  }

  /* ---------- header + hero ---------- */
  var mono = document.getElementById("mono");
  if (has(P.photo)) {
    var av = document.createElement("img");
    av.src = P.photo; av.alt = ""; av.setAttribute("aria-hidden", "true");
    mono.appendChild(av);
  } else {
    mono.textContent = initials(P.name);
  }
  if (has(P.pageTitle)) document.title = P.pageTitle;
  document.getElementById("brandName").textContent = P.name;
  document.getElementById("brandRole").textContent = P.subtitle;
  document.getElementById("eyebrow").textContent = P.eyebrow;
  document.getElementById("name").textContent = P.name;
  document.getElementById("role").innerHTML = esc(P.title) + ' <em>at ' + esc(P.org) + '</em>';
  document.getElementById("lede").textContent = P.intro;

  var photo = document.getElementById("photo");
  photo.src = P.photo;
  photo.alt = P.photoAlt;
  document.getElementById("plateName").textContent = P.title;
  document.getElementById("plateLoc").textContent = P.location;

  var cta = document.getElementById("cta");
  cta.innerHTML =
    '<a class="btn btn-primary" href="#experience">' + svg("arrow") + 'View my experience</a>' +
    (has(P.cv) ? '<a class="btn btn-ghost" href="' + esc(P.cv) + '" download>' + svg("download") + 'Download CV</a>' : '');

  function socialHTML() {
    var h = '';
    if (has(P.linkedin)) h += '<a href="' + esc(P.linkedin) + '" target="_blank" rel="noopener" aria-label="LinkedIn profile">' + svg("linkedin") + '</a>';
    if (has(P.email)) h += '<a href="mailto:' + esc(P.email) + '" aria-label="Send an email">' + svg("mail") + '</a>';
    if (has(P.phone)) h += '<a href="tel:' + esc(P.phone) + '" aria-label="Call">' + svg("phone") + '</a>';
    return h;
  }
  document.getElementById("socials").innerHTML = socialHTML();
  document.getElementById("fSocials").innerHTML = socialHTML();

  document.getElementById("highlights").innerHTML = P.highlights.map(function (h) {
    return '<div><dt>' + esc(h.label) + '</dt><dd>' + esc(h.value) + '</dd></div>';
  }).join("");

  document.getElementById("fName").textContent = P.name;
  document.getElementById("fRole").textContent = P.title + ". " + P.location;
  document.getElementById("fCp").textContent = "\u00A9 " + new Date().getFullYear() + " " + P.name;

  /* ---------- section builders ---------- */
  var B = {};

  B.about = function () {
    return '<div class="prose">' + CV.summary.map(function (p) {
      return '<p>' + esc(p) + '</p>';
    }).join("") + '</div>';
  };

  B.skills = function () {
    return '<div class="skillgrid">' + CV.skillGroups.map(function (g) {
      return '<article class="card skill" data-reveal>' +
        '<span class="ico">' + svg(g.icon) + '</span>' +
        '<h3>' + esc(g.title) + '</h3>' +
        '<ul class="chips">' + g.items.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join("") + '</ul>' +
      '</article>';
    }).join("") + '</div>';
  };

  B.experience = function () {
    return '<div class="tl">' + CV.experience.map(function (j) {
      return '<article class="job' + (j.current ? ' now' : '') + '" data-reveal>' +
        '<div class="card jobcard">' +
          '<div class="jobtop"><h3>' + esc(j.role) + '</h3><span class="when">' + esc(j.dates) + '</span></div>' +
          '<p class="jobmeta">' +
            '<span class="org">' + esc(j.org) + '</span>' +
            (has(j.place) ? '<span class="dot"></span><span>' + esc(j.place) + '</span>' : '') +
            (has(j.type) ? '<span class="pill">' + esc(j.type) + '</span>' : '') +
          '</p>' +
          '<ul>' + j.points.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join("") + '</ul>' +
        '</div>' +
      '</article>';
    }).join("") + '</div>';
  };

  B.projects = function () {
    var t = CV.tools, p = CV.projects;
    var a = '<div class="group"><div class="grouphead"><h3>' + esc(t.heading) + '</h3><p>' + esc(t.blurb) + '</p></div>' +
      '<div class="toolgrid">' + t.items.map(function (x) {
        return '<article class="card tool' + (has(x.desc) ? '' : ' todo') + '" data-reveal>' +
          '<div class="tooltop"><h4>' + esc(x.name) + '</h4>' +
            (has(x.platform) ? '<span class="tag">' + esc(x.platform) + '</span>' : '') + '</div>' +
          (has(x.desc) ? '<p>' + esc(x.desc) + '</p>' : '') +
        '</article>';
      }).join("") + '</div></div>';

    var b = '<div class="group"><div class="grouphead"><h3>' + esc(p.heading) + '</h3><p>' + esc(p.blurb) + '</p></div>' +
      '<div class="projgrid">' + p.items.map(function (x) {
        return '<article class="card proj' + (x.featured ? ' star' : '') + '" data-reveal>' +
          (has(x.tag) ? '<span class="tag">' + esc(x.tag) + '</span>' : '') +
          '<span class="n">' + esc(x.name) + '</span>' +
        '</article>';
      }).join("") + '</div></div>';
    return a + b;
  };

  B.education = function () {
    return '<div class="edugrid">' + CV.education.map(function (e) {
      return '<article class="card edu" data-reveal>' +
        '<span class="ico">' + svg("cap") + '</span>' +
        '<div><h3>' + esc(e.degree) + '</h3>' +
          '<p class="meta"><b>' + esc(e.school) + '</b>' + (has(e.place) ? ". " + esc(e.place) : "") + '</p></div>' +
        '<div class="right"><span class="yr">' + esc(e.year) + '</span><span class="res">' + esc(e.result) + '</span></div>' +
      '</article>';
    }).join("") + '</div>';
  };

  B.training = function () {
    return '<div class="cardgrid">' + CV.training.map(function (t) {
      var sub = [t.org, t.meta].filter(has).join(". ");
      return '<article class="card item" data-reveal>' +
        '<h3>' + esc(t.name) + '</h3>' +
        (sub ? '<p class="sub">' + esc(sub) + '</p>' : '') +
        (has(t.desc) ? '<p>' + esc(t.desc) + '</p>' : '') +
      '</article>';
    }).join("") + '</div>';
  };

  B.more = function () {
    function block(label, cards) {
      return '<div class="block"><p class="sub-h">' + esc(label) + '</p><div class="cardgrid">' + cards + '</div></div>';
    }
    var langs = CV.languages.map(function (l) {
      return '<article class="card item" data-reveal><h4>' + esc(l.name) + '</h4><p>' + esc(l.detail) + '</p></article>';
    }).join("");
    var visits = CV.visits.map(function (v) {
      return '<article class="card item" data-reveal><h4>' + esc(v.name) + '</h4><p>' + esc(v.desc) + '</p></article>';
    }).join("");
    var acts = CV.activities.map(function (a) {
      return '<article class="card item" data-reveal><h4>' + esc(a.name) + '</h4><p class="sub">' + esc(a.role) + '</p><p>' + esc(a.desc) + '</p></article>';
    }).join("");
    return block("Languages", langs) + block("Industrial visits", visits) + block("Activities", acts);
  };

  B.contact = function () {
    var c = CV.contact;
    function row(icon, label, value, href, ext) {
      var tag = href ? "a" : "div";
      var attrs = href ? ' href="' + esc(href) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') : '';
      return '<' + tag + ' class="detail"' + attrs + '>' +
        '<span class="ico">' + svg(icon) + '</span>' +
        '<dl><dt>' + esc(label) + '</dt><dd>' + esc(value) + '</dd></dl>' +
      '</' + tag + '>';
    }
    var rows =
      row("mail", "Email", P.email, "mailto:" + P.email, false) +
      row("phone", "Phone", P.phone + "  /  " + P.phoneAlt, "tel:" + P.phone, false) +
      row("linkedin", "LinkedIn", P.linkedinLabel, P.linkedin, true) +
      row("pin", "Location", P.location, null, false);

    return '<div class="contactbox" data-reveal>' +
      '<h2>' + esc(c.heading) + '</h2>' +
      '<p>' + esc(c.blurb) + '</p>' +
      '<div class="details">' + rows + '</div>' +
      '<a class="btn btn-primary" href="mailto:' + esc(P.email) + '">' + svg("mail") + 'Get in touch</a>' +
    '</div>';
  };

  /* ---------- render the page ---------- */
  var host = document.getElementById("sections");
  var html = "";
  CV.sections.forEach(function (s) {
    if (!B[s.id]) return;
    var head = s.id === "contact" ? "" :
      '<div class="shead" data-reveal><span class="no">' + esc(s.no) + '</span>' +
      '<h2>' + esc(s.title) + '</h2><span class="rule"></span></div>';
    html += '<section id="' + s.id + '" aria-label="' + esc(s.title) + '"><div class="wrap">' +
            head + B[s.id]() + '</div></section>';
  });
  host.innerHTML = html;

  document.getElementById("navlinks").innerHTML = CV.sections
    .filter(function (s) { return s.nav; })
    .map(function (s) { return '<a href="#' + s.id + '" data-id="' + s.id + '">' + esc(s.nav) + '</a>'; })
    .join("");

  /* ---------- behaviour ---------- */
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!still && "IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { rootMargin: "0px 0px -8% 0px", threshold: .08 });
    document.querySelectorAll("[data-reveal]").forEach(function (n) { io.observe(n); });
  } else {
    document.querySelectorAll("[data-reveal]").forEach(function (n) { n.classList.add("in"); });
  }

  var nav = document.getElementById("nav");
  var links = Array.prototype.slice.call(document.querySelectorAll(".navlinks a"));
  var prog = document.getElementById("prog");
  var ticking = false;

  function onScroll() {
    var y = window.scrollY || window.pageYOffset;
    nav.classList.toggle("stuck", y > 12);

    var h = document.documentElement.scrollHeight - window.innerHeight;
    prog.style.width = (h > 0 ? Math.min(100, (y / h) * 100) : 0) + "%";

    var line = y + (window.innerHeight * 0.3);
    var active = null;
    links.forEach(function (a) {
      var sec = document.getElementById(a.dataset.id);
      if (sec && sec.offsetTop <= line) active = a;
    });
    links.forEach(function (a) { a.classList.toggle("active", a === active); });
    ticking = false;
  }
  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; window.requestAnimationFrame(onScroll); }
  }, { passive: true });
  window.addEventListener("resize", onScroll, { passive: true });
  onScroll();

  var burger = document.getElementById("burger");
  var panel = document.getElementById("navlinks");
  function setMenu(open) {
    panel.classList.toggle("open", open);
    burger.setAttribute("aria-expanded", String(open));
    burger.setAttribute("aria-label", open ? "Close the menu" : "Open the menu");
    burger.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="19" height="19">' +
      (open ? ICON.close : '<path d="M3 6h18M3 12h18M3 18h18"/>') + '</svg>';
  }
  burger.addEventListener("click", function () { setMenu(!panel.classList.contains("open")); });
  panel.addEventListener("click", function (e) { if (e.target.tagName === "A") setMenu(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMenu(false); });

  /* ---------- view counter: one device counts once ---------- */
  (function () {
    var V = CV.views, box = document.getElementById("views");
    if (!V || !V.enabled || !box) return;
    if (typeof fetch !== "function") return;   // very old browser: skip quietly
    var seen = false;
    try { seen = localStorage.getItem("sajib-viewed") === "1"; } catch (e) {}
    var url = "https://abacus.jasoncameron.dev/" + (seen ? "get" : "hit") +
              "/" + encodeURIComponent(V.namespace) + "/" + encodeURIComponent(V.key);
    fetch(url)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) return;
        var n = typeof j.value === "number" ? j.value
              : typeof j.count === "number" ? j.count : null;
        if (n === null) return;
        if (!seen) { try { localStorage.setItem("sajib-viewed", "1"); } catch (e) {} }
        box.innerHTML = svg("eye") + "<b>" + n.toLocaleString() + "</b> " + esc(V.label || "views");
        box.hidden = false;
      })
      .catch(function () { /* service unreachable: the pill simply stays hidden */ });
  })();
})();
</script>
</body>
</html>
